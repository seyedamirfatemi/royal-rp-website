<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" >

  <circle cx="30" cy="30" r="8" fill="#3ddc84"/>
  <circle cx="30" cy="30" r="8" fill="none" stroke="#3ddc84" stroke-width="2">
    <animate attributeName="r" from="8" to="26" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from=".8" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
