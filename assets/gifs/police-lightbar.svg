<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" >

  <defs>
    <filter id="b"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/><stop offset="100%" stop-color="#101014"/>
    </linearGradient>
  </defs>

  <!-- glow pools -->
  <ellipse cx="90" cy="48" rx="86" ry="34" fill="#2b6cff" filter="url(#b)" opacity="0">
    <animate attributeName="opacity" values="0;.85;0;0;0;.7;0" dur="1.1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="230" cy="48" rx="86" ry="34" fill="#ff2b2b" filter="url(#b)" opacity="0">
    <animate attributeName="opacity" values="0;0;0;.85;0;0;.7" dur="1.1s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="24" y="34" width="272" height="26" rx="8" fill="url(#bar)" stroke="#000" stroke-width="2"/>

  <g>
    <rect x="34" y="39" width="58" height="16" rx="4" fill="#15325e">
      <animate attributeName="fill" values="#15325e;#2b6cff;#15325e;#15325e" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="98" y="39" width="58" height="16" rx="4" fill="#15325e">
      <animate attributeName="fill" values="#15325e;#15325e;#2b6cff;#15325e" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="164" y="39" width="58" height="16" rx="4" fill="#5e1515">
      <animate attributeName="fill" values="#5e1515;#5e1515;#5e1515;#ff2b2b" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="228" y="39" width="58" height="16" rx="4" fill="#5e1515">
      <animate attributeName="fill" values="#ff2b2b;#5e1515;#5e1515;#5e1515" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="24" y="58" width="272" height="5" rx="2" fill="#09090c"/>
</svg>
