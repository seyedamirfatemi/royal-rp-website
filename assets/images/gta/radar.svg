      <stop offset="0%" stop-color="#3ddc84" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="104" fill="#0a0d14" stroke="url(#g)" stroke-width="3"/>
