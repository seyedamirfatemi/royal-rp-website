    <g transform="translate(10 10)"><path d="M0 20 H200" stroke="#2a2f3a" stroke-width="7"/><path d="M0 46 H200" stroke="#2a2f3a" stroke-width="4"/><path d="M0 72 H200" stroke="#2a2f3a" stroke-width="4"/><path d="M0 98 H200" stroke="#2a2f3a" stroke-width="7"/><path d="M0 124 H200" stroke="#2a2f3a" stroke-width="4"/><path d="M0 150 H200" stroke="#2a2f3a" stroke-width="4"/><path d="M0 176 H200" stroke="#2a2f3a" stroke-width="7"/><path d="M16 0 V200" stroke="#2a2f3a" stroke-width="6"/><path d="M43 0 V200" stroke="#2a2f3a" stroke-width="3"/><path d="M70 0 V200" stroke="#2a2f3a" stroke-width="6"/><path d="M97 0 V200" stroke="#2a2f3a" stroke-width="3"/><path d="M124 0 V200" stroke="#2a2f3a" stroke-width="6"/><path d="M151 0 V200" stroke="#2a2f3a" stroke-width="3"/><path d="M178 0 V200" stroke="#2a2f3a" stroke-width="6"/></g>
    <g><circle cx="83" cy="168" r="3.5" fill="#3ddc84">
      <animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/>
    </circle><circle cx="122" cy="132" r="3.5" fill="#3ddc84">
      <animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite"/>
    </circle><circle cx="25" cy="147" r="3.5" fill="#d4af37">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle><circle cx="63" cy="87" r="3.5" fill="#3ddc84">
      <animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/>
    </circle><circle cx="113" cy="92" r="3.5" fill="#d4af37">
      <animate attributeName="opacity" values="1;.25;1" dur="3.4s" repeatCount="indefinite"/>
    </circle><circle cx="136" cy="168" r="3.5" fill="#d4af37">
      <animate attributeName="opacity" values="1;.25;1" dur="2.0s" repeatCount="indefinite"/>
    </circle><circle cx="91" cy="141" r="3.5" fill="#d4af37">
      <animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/>
    </circle><circle cx="121" cy="104" r="3.5" fill="#2b6cff">
