  <!-- player arrow -->
  <path d="M110 98 L119 120 L110 114 L101 120 Z" fill="#ffd700" stroke="#2a2208" stroke-width="1.5"/>
  <circle cx="110" cy="110" r="96" fill="none" stroke="#d4af37" stroke-opacity=".35"/>
  
