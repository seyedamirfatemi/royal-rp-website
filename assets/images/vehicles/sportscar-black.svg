<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" >

  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="55%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fc2e8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#1b2430"/>
    </linearGradient>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#000" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="#0b0b0d"/>
  <ellipse cx="300" cy="248" rx="250" ry="30" fill="url(#floor)"/>

  <!-- body -->
  <path d="M60 206 C56 170 70 158 108 150
