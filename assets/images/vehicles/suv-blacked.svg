    <circle cx="160" cy="224" r="9" fill="#d4af37"/>
    <path d="M160 224 L185.0 224.0" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M160 224 L172.5 245.7" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M160 224 L147.5 245.7" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M160 224 L135.0 224.0" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M160 224 L147.5 202.3" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M160 224 L172.5 202.3" stroke="#d4af37" stroke-width="3" opacity=".75"/>
    <circle cx="440" cy="224" r="46" fill="#0b0b0b"/>
    <circle cx="440" cy="224" r="27" fill="#1d1d1d" stroke="#d4af37" stroke-width="3"/>
    <circle cx="440" cy="224" r="9" fill="#d4af37"/>
    <path d="M440 224 L465.0 224.0" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M440 224 L452.5 245.7" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M440 224 L427.5 245.7" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M440 224 L415.0 224.0" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M440 224 L427.5 202.3" stroke="#d4af37" stroke-width="3" opacity=".75"/><path d="M440 224 L452.5 202.3" stroke="#d4af37" stroke-width="3" opacity=".75"/>
  </g>
  <text x="300" y="282" text-anchor="middle" font-family="Georgia,serif" font-size="20" letter-spacing="6" fill="#d4af37" opacity=".8">SUV</text>
  
