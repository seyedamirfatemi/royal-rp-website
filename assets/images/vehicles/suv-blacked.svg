  <path d="M298 46 V112" stroke="#0a0a0a" stroke-width="2.5"/>

  <!-- body shine -->
  <path d="M78 192 C150 176 450 176 524 192 L524 200 C450 184 150 184 78 200 Z" fill="url(#shine)"/>

