<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>فروشگاه — ROYAL RP</title>
<meta name="description" content="اشتراک VIP، خودرو، ملک، کسب‌وکار و پوشاک برای رویال آر‌پی. هیچ چیزی اینجا برنده درگیری‌تان نمی‌کند.">

<link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
<link rel="apple-touch-icon" href="../assets/logos/royal-rp-logo.png">

<meta property="og:type" content="website">
<meta property="og:title" content="فروشگاه — ROYAL RP">
<meta property="og:description" content="اشتراک VIP، خودرو، ملک، کسب‌وکار و پوشاک برای رویال آر‌پی. هیچ چیزی اینجا برنده درگیری‌تان نمی‌کند.">
<meta property="og:image" content="../assets/logos/og-cover.svg">
<meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="../css/royal.min.css">
</head>

<body data-page="shop">

<a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>

<main id="main" class="page-main">
  <header class="page-head">
    <div class="page-head__pattern" aria-hidden="true"></div>
    <div class="wrap">
      <h1 data-i18n="shop.title">Store</h1>
      <p data-i18n="shop.sub">Everything here funds hosting and development. Nothing here wins you a gunfight.</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../index.html" data-i18n="nav.home">Home</a><span class="sep">/</span>
          <span class="current" data-i18n="shop.title">Store</span>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="wrap-wide">
      <div id="shop-demo-notice"></div>

      <div class="shop-layout">

        
        <aside class="shop-aside" aria-label="Product filters">
          <div class="filter-group">
            <h5 data-i18n="shop.categories">Categories</h5>
            <div class="filter-list" id="shop-categories"></div>
          </div>

          <div class="filter-group">
            <h5><span data-i18n="shop.price">Price</span> <span id="shop-price-label" class="text-gold mono"></span></h5>
            <input type="range" id="shop-price" min="0" max="150" step="1" value="150"
                   style="width:100%;accent-color:var(--c-gold)" aria-label="Maximum price">
          </div>

          <div class="filter-group">
            <h5>انتخاب سریع</h5>
            <div class="chip-row">
              <button class="chip" data-cat="vip">VIP</button>
              <button class="chip" data-cat="vehicles">خودروها</button>
              <button class="chip" data-cat="money">بسته‌های پول</button>
              <button class="chip" data-cat="property">املاک</button>
            </div>
          </div>

          <button class="btn btn--ghost btn--sm btn--block" id="shop-clear-top" data-i18n="shop.clearFilters">
            Clear all filters
          </button>

          <div class="card card--pad-sm card--flat">
            <div class="flex gap-3 items-center">
              <svg style="width:20px;height:20px;color:var(--c-gold);flex:none" aria-hidden="true"><use href="#i-shield"></use></svg>
              <p style="font-size:.78rem;margin:0;line-height:1.6">
                قیمت هر خرید پیش از پرداخت، دوباره روی سرور محاسبه و بررسی می‌شود.
              </p>
            </div>
          </div>
        </aside>

        
        <div>
          <div class="shop-toolbar">
            <button class="btn btn--ghost btn--sm hidden filter-toggle" id="shop-filter-toggle" style="display:none">
              <svg aria-hidden="true"><use href="#i-filter"></use></svg>
              <span data-i18n="common.filters">Filters</span>
            </button>

            <div class="searchbox">
              <svg aria-hidden="true"><use href="#i-search"></use></svg>
              <input class="input" id="shop-search" placeholder="Search the store..."
                     data-i18n-attr="placeholder:shop.searchPlaceholder" aria-label="Search products">
            </div>

            <span class="result-count" id="shop-count"></span>

            <select class="select" id="shop-sort" style="max-width:210px" aria-label="Sort products">
              <option value="popular"   data-i18n="shop.sortPopular">Most popular</option>
              <option value="newest"    data-i18n="shop.sortNewest">Newest</option>
              <option value="priceAsc"  data-i18n="shop.sortPriceAsc">Price: low to high</option>
              <option value="priceDesc" data-i18n="shop.sortPriceDesc">Price: high to low</option>
              <option value="name"      data-i18n="shop.sortName">Name A-Z</option>
            </select>
          </div>

          <div class="chip-row mb-6" id="shop-chips"></div>

          <div class="grid g-3" id="shop-grid"></div>

          <div class="pagination" id="shop-pagination"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="../js/app.js"></script>
</body>
</html>
